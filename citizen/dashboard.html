<a href="report.html">

<a href="my-complaints.html">

<a href="notifications.html">

<a href="profile.html">

<a href="../login.html">

<div class="header">

<div>

<h1>Citizen Dashboard</h1>

<p>Welcome Back 👋</p>

</div>

<div>

<i class="fa-solid fa-bell fa-xl"></i>

</div>

</div>

<div class="cards">

<div class="card">

</div>

<div class="card">

<h2 id="pendingComplaints">0</h2>

</div>

<div class="card">

<h2 id="progressComplaints">0</h2>

<p>In Progress</p>

</div>

<div class="card">

<h2 id="resolvedComplaints">0</h2>

<p>Resolved</p>

</div>

</div>

<!-- Quick Actions -->

<div class="table-box">

<h2>Quick Actions</h2>

<br>

<a href="report.html">

<button>Report Complaint</button>

</a>

<a href="my-complaints.html">

<button>My Complaints</button>

</a>

<a href="notifications.html">

<button>Notifications</button>

</a>

</div>

<div class="table-box">

<h2 style="margin-bottom:20px;">

Recent Complaints

</h2>

<table>

<thead>

<tr>

<th>ID</th>

<th>Category</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="recentComplaints">

<tr>

<td colspan="4" style="text-align:center;">

</td>

</tr>

</tbody>
