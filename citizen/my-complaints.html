<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Complaints | CivicConnect</title>

<link rel="stylesheet"
href="../css/citizen/my-complaints.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<div class="container">

<!-- Sidebar -->

<div class="sidebar">

<h2 class="logo">

<i class="fa-solid fa-city"></i>

CivicConnect

</h2>

<a href="dashboard.html">

<i class="fa-solid fa-house"></i>

Dashboard

</a>

<a href="report.html">

<i class="fa-solid fa-circle-exclamation"></i>

Report Complaint

</a>

<a href="my-complaints.html" class="active">

<i class="fa-solid fa-folder-open"></i>

My Complaints

</a>

<a href="notifications.html">

<i class="fa-solid fa-bell"></i>

Notifications

</a>

<a href="profile.html">

<i class="fa-solid fa-user"></i>

Profile

</a>

<a href="settings.html">

<i class="fa-solid fa-gear"></i>

Settings

</a>

<a href="../login.html">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</a>

</div>

<!-- Main -->

<div class="main">

<h1>

<i class="fa-solid fa-folder-open"></i>

My Complaints

</h1>

<!-- Search -->

<div class="search-box">

<input

type="text"

id="searchComplaint"

placeholder="Search Complaint ID or Category">

</div>

<!-- Filter -->

<div class="filter-box">

<select id="statusFilter">

<option value="All">All Status</option>

<option value="Pending">Pending</option>

<option value="In Progress">In Progress</option>

<option value="Resolved">Resolved</option>

</select>

</div>

<!-- Complaint Cards -->

<div id="complaintsContainer"

class="complaints-grid">

</div>

</div>

</div>

<script src="../js/citizen/my-complaints.js"></script>

</body>

</html>
