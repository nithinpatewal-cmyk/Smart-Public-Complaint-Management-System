<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Complaints | CivicConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <i class="fa-solid fa-city"></i> CivicConnect <span class="badge bg-primary text-uppercase fs-6 ms-2">Citizen</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#citizenNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="citizenNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fa-solid fa-gauge me-1"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="report.html"><i class="fa-solid fa-circle-exclamation me-1"></i> Report Issue</a></li>
                    <li class="nav-item"><a class="nav-link active" href="my-complaints.html"><i class="fa-solid fa-folder-open me-1"></i> My Complaints</a></li>
                    <li class="nav-item"><a class="nav-link" href="notifications.html"><i class="fa-solid fa-bell me-1"></i> Notifications <span id="notificationBadge" class="badge bg-danger rounded-pill"></span></a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html"><i class="fa-solid fa-user me-1"></i> Profile</a></li>
                    <li class="nav-item"><a class="btn btn-outline-danger btn-sm ms-lg-3 btn-logout" href="../login.html"><i class="fa-solid fa-right-from-bracket me-1"></i> Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold text-dark mb-0"><i class="fa-solid fa-folder-open text-primary me-2"></i> My Submitted Complaints</h2>
                <p class="text-muted small mb-0">Search, filter, and track complaint statuses and resolution proofs</p>
            </div>
            <a href="report.html" class="btn btn-primary fw-bold shadow-sm">
                <i class="fa-solid fa-plus me-1"></i> Submit New Complaint
            </a>
        </div>

        <!-- Filter & Search Bar -->
        <div class="card p-3 shadow-sm border-0 mb-4" style="border-radius: 12px;">
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                        <input type="text" id="searchComplaint" class="form-control border-start-0" placeholder="Search by Complaint ID, title, category, or location...">
                    </div>
                </div>
                <div class="col-md-3">
                    <select id="statusFilter" class="form-select">
                        <option value="All">All Statuses</option>
                        <option value="Pending">Pending</option>
                        <option value="Accepted">Accepted</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="categoryFilter" class="form-select">
                        <option value="All">All Categories</option>
                        <option value="Road Damage">Road Damage</option>
                        <option value="Garbage">Garbage</option>
                        <option value="Street Light">Street Light</option>
                        <option value="Water Leakage">Water Leakage</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Complaints List Container -->
        <div id="complaintsContainer" class="row g-4">
            <div class="col-12 text-center py-5 text-muted">
                <i class="fa-solid fa-spinner fa-spin fa-2x mb-2 d-block"></i>
                Loading your complaints...
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/citizen/my-complaints.js"></script>
</body>
</html>
