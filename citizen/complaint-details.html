<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Complaint Details | CivicConnect</title>

<link rel="stylesheet"
href="../css/citizen/complaint-details.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<div class="container">

<!-- Sidebar -->

<div class="sidebar">

<h2 class="logo">

<i class="fa-solid fa-city"></i>

CivicConnect

</h2>

<a href="dashboard.html">

<i class="fa-solid fa-house"></i>

Dashboard

</a>

<a href="report.html">

<i class="fa-solid fa-circle-exclamation"></i>

Report Complaint

</a>

<a href="my-complaints.html" class="active">

<i class="fa-solid fa-folder-open"></i>

My Complaints

</a>

<a href="notifications.html">

<i class="fa-solid fa-bell"></i>

Notifications

</a>

<a href="profile.html">

<i class="fa-solid fa-user"></i>

Profile

</a>

<a href="settings.html">

<i class="fa-solid fa-gear"></i>

Settings

</a>

<a href="../login.html">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</a>

</div>

<!-- Main -->

<div class="main">

<h1>

<i class="fa-solid fa-file-circle-check"></i>

Complaint Details

</h1>

<div class="details-card">

<img id="complaintImage">

<div class="info-grid">

<div>

<label>Complaint ID</label>

<input id="cid" readonly>

</div>

<div>

<label>Category</label>

<input id="category" readonly>

</div>

<div>

<label>Priority</label>

<input id="priority" readonly>

</div>

<div>

<label>Status</label>

<input id="status" readonly>

</div>

<div>

<label>Date</label>

<input id="date" readonly>

</div>

<div>

<label>Time</label>

<input id="time" readonly>

</div>

</div>

<label>Description</label>

<textarea id="description" rows="5" readonly></textarea>

<label>Address</label>

<textarea id="address" rows="3" readonly></textarea>

<div class="location">

<p>

Latitude :

<span id="latitude"></span>

</p>

<p>

Longitude :

<span id="longitude"></span>

</p>

</div>

<div id="map"></div>

<h2>Department Resolution</h2>

<label>Officer Remarks</label>

<textarea id="remarks" rows="4" readonly></textarea>

<label>Resolution Image</label>

<img id="resolutionImage">

<button onclick="history.back()">

<i class="fa-solid fa-arrow-left"></i>

Back

</button>

</div>

</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="../js/citizen/complaint-details.js"></script>

</body>

</html>
