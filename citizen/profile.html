<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | CivicConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <i class="fa-solid fa-city"></i> CivicConnect <span class="badge bg-primary text-uppercase fs-6 ms-2">Citizen</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#citizenNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="citizenNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fa-solid fa-gauge me-1"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="report.html"><i class="fa-solid fa-circle-exclamation me-1"></i> Report Issue</a></li>
                    <li class="nav-item"><a class="nav-link" href="my-complaints.html"><i class="fa-solid fa-folder-open me-1"></i> My Complaints</a></li>
                    <li class="nav-item"><a class="nav-link" href="notifications.html"><i class="fa-solid fa-bell me-1"></i> Notifications <span id="notificationBadge" class="badge bg-danger rounded-pill"></span></a></li>
                    <li class="nav-item"><a class="nav-link active" href="profile.html"><i class="fa-solid fa-user me-1"></i> Profile</a></li>
                    <li class="nav-item"><a class="btn btn-outline-danger btn-sm ms-lg-3 btn-logout" href="../login.html"><i class="fa-solid fa-right-from-bracket me-1"></i> Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 p-4" style="border-radius: 16px;">
                    <div class="d-flex align-items-center mb-4 pb-3 border-bottom">
                        <i class="fa-solid fa-circle-user fa-3x text-primary me-3"></i>
                        <div>
                            <h2 class="fw-bold text-dark mb-0">Citizen Profile</h2>
                            <p class="text-muted small mb-0">Manage your personal contact details and residential address</p>
                        </div>
                    </div>

                    <form id="profileForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Username</label>
                                <input type="text" id="username" class="form-control" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email Address</label>
                                <input type="email" id="email" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" id="phone" class="form-control" placeholder="10-digit mobile number">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Account Role</label>
                                <input type="text" id="role" class="form-control" readonly>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Residential Address</label>
                                <textarea id="address" class="form-control" rows="3" placeholder="Enter house/street address"></textarea>
                            </div>
                            <div class="col-12 text-end mt-4">
                                <button type="submit" class="btn btn-primary fw-bold px-4">
                                    <i class="fa-solid fa-floppy-disk me-1"></i> Save Profile
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/citizen/profile.js"></script>
</body>
</html>
