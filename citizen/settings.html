<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings | CivicConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <i class="fa-solid fa-city"></i> CivicConnect <span class="badge bg-primary text-uppercase fs-6 ms-2">Citizen</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#citizenNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="citizenNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fa-solid fa-gauge me-1"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="report.html"><i class="fa-solid fa-circle-exclamation me-1"></i> Report Issue</a></li>
                    <li class="nav-item"><a class="nav-link" href="my-complaints.html"><i class="fa-solid fa-folder-open me-1"></i> My Complaints</a></li>
                    <li class="nav-item"><a class="nav-link" href="notifications.html"><i class="fa-solid fa-bell me-1"></i> Notifications <span id="notificationBadge" class="badge bg-danger rounded-pill"></span></a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html"><i class="fa-solid fa-user me-1"></i> Profile</a></li>
                    <li class="nav-item"><a class="btn btn-outline-danger btn-sm ms-lg-3 btn-logout" href="../login.html"><i class="fa-solid fa-right-from-bracket me-1"></i> Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 p-4 mb-4" style="border-radius: 16px;">
                    <div class="d-flex align-items-center mb-4 pb-3 border-bottom">
                        <i class="fa-solid fa-key fa-2x text-primary me-3"></i>
                        <div>
                            <h3 class="fw-bold text-dark mb-0">Change Password</h3>
                            <p class="text-muted small mb-0">Update your account security password</p>
                        </div>
                    </div>

                    <form id="passwordForm">
                        <div class="mb-3">
                            <label class="form-label">Current Password</label>
                            <input type="password" id="oldPassword" class="form-control" placeholder="Enter current password" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" id="newPassword" class="form-control" placeholder="Enter new password (min 6 chars)" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirm New Password</label>
                            <input type="password" id="confirmNewPassword" class="form-control" placeholder="Re-enter new password" required>
                        </div>

                        <div class="text-end">
                            <button type="submit" class="btn btn-primary fw-bold">
                                <i class="fa-solid fa-lock me-1"></i> Update Password
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/citizen/settings.js"></script>
</body>
</html>
