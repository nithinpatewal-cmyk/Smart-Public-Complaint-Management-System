<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | CivicConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <i class="fa-solid fa-city"></i> CivicConnect <span class="badge bg-primary text-uppercase fs-6 ms-2">Citizen</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#citizenNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="citizenNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fa-solid fa-gauge me-1"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="report.html"><i class="fa-solid fa-circle-exclamation me-1"></i> Report Issue</a></li>
                    <li class="nav-item"><a class="nav-link" href="my-complaints.html"><i class="fa-solid fa-folder-open me-1"></i> My Complaints</a></li>
                    <li class="nav-item"><a class="nav-link active" href="notifications.html"><i class="fa-solid fa-bell me-1"></i> Notifications <span id="notificationBadge" class="badge bg-danger rounded-pill"></span></a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html"><i class="fa-solid fa-user me-1"></i> Profile</a></li>
                    <li class="nav-item"><a class="btn btn-outline-danger btn-sm ms-lg-3 btn-logout" href="../login.html"><i class="fa-solid fa-right-from-bracket me-1"></i> Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="card shadow-lg border-0 p-4" style="border-radius: 16px;">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div>
                    <h2 class="fw-bold text-dark mb-0"><i class="fa-solid fa-bell text-primary me-2"></i> Real-Time Notifications</h2>
                    <p class="text-muted small mb-0">System alerts and department status update messages</p>
                </div>
                <button id="markAllReadBtn" class="btn btn-outline-primary fw-semibold">
                    <i class="fa-solid fa-check-double me-1"></i> Mark All as Read
                </button>
            </div>

            <div id="notificationContainer" class="list-group">
                <div class="text-center py-5 text-muted">
                    <i class="fa-solid fa-spinner fa-spin fa-2x mb-2 d-block"></i>
                    Fetching notifications...
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/citizen/notifications.js"></script>
</body>
</html>
