href="../css/department/update-status.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<div class="container">

<!-- Sidebar -->

<div class="sidebar">

<h2 class="logo">

<i class="fa-solid fa-city"></i>

CivicConnect

</h2>

<a href="dashboard.html">

<i class="fa-solid fa-house"></i>

Dashboard

</a>

<a href="assigned-complaints.html">

<i class="fa-solid fa-list-check"></i>

Assigned Complaints

</a>

<a href="update-status.html" class="active">

<i class="fa-solid fa-arrows-rotate"></i>

Update Status

</a>

<a href="upload-resolution.html">

<i class="fa-solid fa-camera"></i>

Upload Resolution

</a>

<a href="reports.html">

<i class="fa-solid fa-chart-column"></i>

Reports

</a>

<a href="profile.html">

<i class="fa-solid fa-user"></i>

<a href="../login.html">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</a>

</div>

<!-- Main -->

<div class="main">

<h1>Update Complaint Status</h1>

<div class="status-card">

<h3>Complaint Details</h3>

<p>

<b>Complaint ID :</b>

<span id="complaintId">CC0001</span>

</p>

<p>

<b>Category :</b>

<span id="category">Road Damage</span>

</p>

<p>

<b>Current Status :</b>

<span id="currentStatus">Pending</span>

</p>

<hr>

<label>Update Status</label>

<select id="newStatus">

<option value="Pending">Pending</option>

<option value="In Progress">In Progress</option>

<option value="Resolved">Resolved</option>

</select>

<label style="margin-top:20px;">

Department Remarks

</label>

<textarea
id="remarks"
rows="5"
placeholder="Enter remarks..."></textarea>

<button id="saveStatus">

<i class="fa-solid fa-floppy-disk"></i>

Save Status

</button>

</div>

</div>

</div>

<script src="../js/auth.js"></script>
<script src="../js/department/update-status.js"></script>

</body>
