<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<div class="container">

<!-- Sidebar -->

<div class="sidebar">

<h2 class="logo">

<i class="fa-solid fa-city"></i>

CivicConnect

</h2>

<a href="dashboard.html">

<i class="fa-solid fa-house"></i>

Dashboard

</a>

<a href="assigned-complaints.html">

<i class="fa-solid fa-list-check"></i>

Assigned Complaints

</a>

<a href="update-status.html">

<i class="fa-solid fa-rotate"></i>

Update Status

</a>

<a href="upload-resolution.html">

<i class="fa-solid fa-camera"></i>

Upload Resolution

</a>

<a href="reports.html">

<i class="fa-solid fa-chart-column"></i>

<a href="profile.html" class="active">

<i class="fa-solid fa-user"></i>

<a href="../login.html">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</a>

</div>

<!-- Main -->

<div class="main">

<h1>Department Profile</h1>

<div class="profile-card">

<div class="avatar">

<i class="fa-solid fa-user-tie"></i>

</div>

<label>Officer Name</label>

<input
type="text"
id="officerName"
value="Ramesh Kumar">

<label>Department</label>

<input
type="text"
id="department"
value="Road Department"
readonly>

<label>Email</label>

<input
type="email"
id="email"
value="road@civicconnect.gov">

<label>Phone</label>

<input
type="text"
id="phone"
value="9876543210">

<label>Change Password</label>

<input
type="password"
id="password"
placeholder="Enter New Password">

<button id="saveProfile">

<i class="fa-solid fa-floppy-disk"></i>

Save Profile

</button>

</div>

</div>

</div>

<script src="../js/department/profile.js"></script>

</body>

</html>
