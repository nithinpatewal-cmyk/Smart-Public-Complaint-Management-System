<h1>Upload Resolution</h1>

<div class="upload-card">

<p>

<b>Complaint ID :</b>

<span id="complaintId">CC0001</span>

</p>

<label>

Completion Photo

</label>

<input
type="file"
id="resolutionImage"
accept="image/*">

<img
id="preview"
style="display:none;">

<label>

Officer Remarks

</label>

<textarea
id="remarks"
rows="5"
placeholder="Describe the work completed..."></textarea>

<button id="submitResolution">

<i class="fa-solid fa-upload"></i>

Upload Resolution

</button>

</div>

</div>
