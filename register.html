<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CivicConnect | Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/register.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="register-card shadow-lg">

<h2>Create Account</h2>

<p>Join CivicConnect and help improve your city.</p>

<form id="registerForm">

<div class="row">

<div class="col-md-6 mb-3">

<label>Full Name</label>

<input
type="text"
id="fullname"
class="form-control"
placeholder="Enter Full Name"
required>

</div>

<div class="col-md-6 mb-3">

<label>Mobile Number</label>

<input
type="tel"
id="phone"
class="form-control"
placeholder="9876543210"
required>

</div>

</div>

<div class="mb-3">

<label>Email Address</label>

<input
type="email"
id="email"
class="form-control"
placeholder="Enter Email"
required>

</div>

<div class="mb-3">

<label>Address</label>

<textarea
id="address"
class="form-control"
rows="3"
placeholder="Enter Address"
required></textarea>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label>Password</label>

<input
type="password"
id="password"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label>Confirm Password</label>

<input
type="password"
id="confirmPassword"
class="form-control"
required>

</div>

</div>

<button
type="submit"
class="btn btn-primary w-100">

Create Account

</button>

</form>

<div class="text-center mt-3">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</div>

</div>

<script src="js/register.js"></script>

</body>

</html>

<div class="text-center mt-3">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</div>

</div>

</body>

</html>
