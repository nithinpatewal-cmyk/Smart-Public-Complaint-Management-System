<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reports | CivicConnect</title>

<link rel="stylesheet" href="../css/admin/reports.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="container">

<!-- Sidebar -->

<div class="sidebar">

<h2 class="logo">

<i class="fa-solid fa-city"></i>

CivicConnect

</h2>

<a href="dashboard.html">

<i class="fa-solid fa-gauge"></i>

Dashboard

</a>

<a href="complaints.html">

<i class="fa-solid fa-list-check"></i>

Complaints

</a>

<a href="citizens.html">

<i class="fa-solid fa-users"></i>

Citizens

</a>

<a href="departments.html">

<i class="fa-solid fa-building"></i>

Departments

</a>

<a href="reports.html" class="active">

<i class="fa-solid fa-chart-column"></i>

Reports

</a>

<a href="settings.html">

<i class="fa-solid fa-gear"></i>

Settings

</a>

<a href="../login.html">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</a>

</div>

<!-- Main -->

<div class="main">

<h1>Reports & Analytics</h1>

<!-- Cards -->

<div class="cards">

<div class="card">

<h2 id="totalComplaints">0</h2>

<p>Total Complaints</p>

</div>

<div class="card">

<h2 id="pendingComplaints">0</h2>

<p>Pending</p>

</div>

<div class="card">

<h2 id="resolvedComplaints">0</h2>

<p>Resolved</p>

</div>

<div class="card">

<h2 id="rejectedComplaints">0</h2>

<p>Rejected</p>

</div>

</div>

<!-- Charts -->

<div class="chart-container">

<div class="chart-card">

<h3>Complaint Status</h3>

<canvas id="statusChart"></canvas>

</div>

<div class="chart-card">

<h3>Department Wise Complaints</h3>

<canvas id="departmentChart"></canvas>

</div>

</div>

<!-- Export -->

<div class="export-box">

<button id="exportBtn">

<i class="fa-solid fa-download"></i>

Export Report

</button>

</div>

</div>

</div>

<script src="../js/admin/reports.js"></script>

</body>

</html>
