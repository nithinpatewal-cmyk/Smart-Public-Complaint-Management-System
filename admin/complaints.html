<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Manage Complaints | CivicConnect</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
href="../css/admin/complaints.css">

</head>

<body>

<div class="d-flex">

<!-- Sidebar -->

<div class="sidebar">

<h2 class="logo">

<i class="fa-solid fa-city"></i>

CivicConnect

</h2>

<a href="dashboard.html">

<i class="fa-solid fa-gauge"></i>

Dashboard

</a>

<a href="complaints.html"
class="active">

<i class="fa-solid fa-list-check"></i>

Complaints

</a>

<a href="citizens.html">

<i class="fa-solid fa-users"></i>

Citizens

</a>

<a href="departments.html">

<i class="fa-solid fa-building"></i>

Departments

</a>

<a href="reports.html">

<i class="fa-solid fa-chart-column"></i>

Reports

</a>

<a href="profile.html">

<i class="fa-solid fa-user"></i>

Profile

</a>

<a href="../login.html">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</a>

</div>

<!-- Main Content -->

<div class="main-content">

<div class="topbar">

<h2>

Manage Complaints

</h2>

</div>

<!-- Search -->

<div class="toolbar">

<input
type="text"
id="searchInput"
placeholder="Search Complaint...">

<select id="statusFilter">

<option value="all">

All Status

</option>

<option value="Pending">

Pending

</option>

<option value="Accepted">

Accepted

</option>

<option value="Rejected">

Rejected

</option>

<option value="Resolved">

Resolved

</option>

</select>

</div>

<!-- Complaint Table -->

<div class="table-responsive">

<table class="table table-hover">

<thead>

<tr>

<th>ID</th>

<th>Citizen</th>

<th>Category</th>

<th>Department</th>

<th>Status</th>

<th>Date</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="complaintTable">

<tr>

<td>CC1001</td>

<td>Nithin</td>

<td>Road Damage</td>

<td>Road Department</td>

<td>

<span class="badge bg-warning">

Pending

</span>

</td>

<td>30-06-2026</td>

<td>

<button
class="btn btn-success btn-sm">

Accept

</button>

<button
class="btn btn-danger btn-sm">

Reject

</button>

<button
class="btn btn-primary btn-sm">

View

</button>

</td>

</tr>

<tr>

<td>CC1002</td>

<td>Rahul</td>

<td>Garbage</td>

<td>Sanitation</td>

<td>

<span class="badge bg-success">

Accepted

</span>

</td>

<td>29-06-2026</td>

<td>

<button
class="btn btn-primary btn-sm">

View

</button>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

<script src="../js/admin/complaints.js"></script>

</body>

</html>
